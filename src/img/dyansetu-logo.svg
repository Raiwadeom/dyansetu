<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="DyanSetu">
  <title>DyanSetu</title>

  <!--
    Mortarboard over an open book, in the colours of the college emblem.

    Drawn for 48px first, not for the poster. The original artwork carried a
    laurel wreath, a tassel and ruled page lines; every one of those is thinner
    than a pixel in the navigation bar, and together they turned the mark into a
    smudge. What survives is three bold shapes with no stroke thinner than about
    3px on screen, filling ~90% of the field instead of 70%.

    The cream field is what keeps it readable on the dark navy sign-in panel,
    where a navy-on-navy mark would disappear; the navy rim does the same job
    against the white header. The book is held clear of the rim on purpose:
    run it to the edge and the navy page merges into the navy ring at 48px.
  -->

  <circle cx="80" cy="80" r="76" fill="#1C234F"/>
  <circle cx="80" cy="80" r="67" fill="#FFF9F0"/>

  <!-- Mortarboard -->
  <polygon points="80,34 124,53 80,72 36,53" fill="#C08A4E"/>
  <polygon points="67,63 93,63 89,80 71,80" fill="#9C6B36"/>

  <!-- Open book -->
  <polygon points="31,93 77,83 77,125 31,116" fill="#1C234F"/>
  <polygon points="129,93 83,83 83,125 129,116" fill="#1C234F"/>
</svg>
