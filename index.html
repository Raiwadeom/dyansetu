  <style> /* ---------------------------------------------------------- start-up splash Also inlined in index.html (shown before any script runs). Keep in sync. A saffron arc circles the logo and five "bridge" dots light up in turn. It keeps moving even with the system's reduce-motion setting: a frozen loader looks like the site is stuck (the old bar froze half-way). */ .ds-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: radial-gradient(circle at 50% 42%, #FFFFFF 0, #F6F8FB 55%, #EEF2F8 100%); font-family: 'Poppins', 'Inter', system-ui, sans-serif; } .ds-splash-logo { position: relative; width: 96px; height: 96px; margin-bottom: 14px; } .ds-splash-logo img { position: relative; width: 100%; height: 100%; border-radius: 24px; display: block; box-shadow: 0 10px 26px rgba(30,58,95,.22); animation: dsFloat 2.4s ease-in-out infinite; } .ds-splash-logo::before { content: ""; position: absolute; inset: -22px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(232,174,74,0) 0 55%, #E8AE4A 78%, #E65100 100%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); animation: dsSpin 1.1s linear infinite; } .ds-splash-logo::after { content: ""; position: absolute; inset: -22px; border-radius: 50%; border: 1px solid rgba(30,58,95,.10); } .ds-splash-name { font-size: 26px; font-weight: 800; color: #1E3A5F; letter-spacing: -.01em; animation: dsRise .6s ease-out both; } .ds-splash-name span { color: #E8AE4A; } .ds-splash-bar { display: flex; align-items: center; gap: 8px; height: 12px; } .ds-splash-bar i { width: 9px; height: 9px; border-radius: 50%; background: #D5DDE8; animation: dsWave 1.2s ease-in-out infinite; } .ds-splash-bar i:nth-child(2) { animation-delay: .12s; } .ds-splash-bar i:nth-child(3) { animation-delay: .24s; } .ds-splash-bar i:nth-child(4) { animation-delay: .36s; } .ds-splash-bar i:nth-child(5) { animation-delay: .48s; } .ds-splash-label { font-size: 13px; letter-spacing: .04em; color: #5A6675; } @keyframes dsSpin { to { transform: rotate(360deg); } } @keyframes dsFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } } @keyframes dsWave { 0%, 60%, 100% { transform: translateY(0) scale(1); background: #D5DDE8; } 30% { transform: translateY(-6px) scale(1.15); background: #E65100; } } @keyframes dsRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } </style>
